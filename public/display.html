<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candy Cloud 呼び出し</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/logo-192.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="/logo-192.jpg">
  <style>
    html, body { background: var(--bg); overflow: hidden; }
    #system-banner { position: fixed; left: 0; right: 0; top: 0; } /* overlay; the TV layout is sized to 100vh */
    .tv-head { display: flex; align-items: center; gap: 2vw; padding: 0 3vw; height: 12vh; }
    .tv-head img { height: 7vh; width: 7vh; }
    .tv-head h1 { font-size: 5vh; font-weight: 900; }
    .tv-head h1 em { font-style: normal; color: var(--red); }
    .tv-head .sub { font-size: 2.4vh; color: var(--muted); font-weight: 700; letter-spacing: .1em; }
    .tv-head .clock { margin-left: auto; font-size: 4vh; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tv-head .conn { font-size: 1.5vh; }

    .tv { display: grid; grid-template-columns: 1fr 1.15fr; gap: 2vw; padding: 0 3vw; height: 74vh; }
    .tv section { border-radius: 3.2vh; padding: 3vh 2.4vw; overflow: hidden; display: flex; flex-direction: column; }
    .tv h2 { font-size: 4vh; font-weight: 900; margin-bottom: 2.4vh; display: flex; align-items: baseline; gap: 1vw; }
    .tv h2 small { font-size: 2vh; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }

    /* Ready = the red panel: the one thing customers should look for */
    .ready { background: var(--red); color: #fff; box-shadow: 0 2vh 5vh rgba(225, 24, 44, .25); }
    .waiting { background: var(--panel); box-shadow: var(--shadow); }

    .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(18vh, 1fr)); gap: 1.8vh; align-content: start; }
    .num {
      background: #fff; color: var(--ink); border-radius: 2.4vh; text-align: center; font-weight: 900;
      font-size: 8vh; padding: 1.4vh 0; font-variant-numeric: tabular-nums; letter-spacing: -.03em;
    }
    .num.new { animation: callout .8s ease-in-out 6; }

    .idle { font-size: 3.2vh; opacity: .75; margin: auto; text-align: center; line-height: 1.7; font-weight: 700; }
    .waiting .idle { color: var(--muted); opacity: 1; }

    /* ---- Live order tracker (準備中): one row per order, the current step pings ---- */
    .waiting h2 .meta { margin-left: auto; display: flex; gap: 1vw; align-items: center; }
    .waiting h2 .pill {
      font-size: 2vh; font-weight: 800; letter-spacing: 0; text-transform: none; opacity: 1;
      background: var(--bg); color: var(--ink-2); padding: .7vh 1.4vh; border-radius: 999px;
    }
    .waiting h2 .pill:empty { display: none; }
    .waiting h2 .pill.wait { background: var(--red-tint); color: var(--red); }
    .trk-viewport { flex: 1; min-height: 0; overflow-x: clip; overflow-y: visible; }
    /* Pages sit side by side: rows fill one page-wide column, then the next. Paging slides the list left. */
    .trk-list {
      display: grid; grid-auto-flow: column; grid-auto-columns: 100%; column-gap: 4vw; row-gap: 1.2vh;
      transition: transform .9s cubic-bezier(.65, 0, .35, 1);
    }
    .trk-row {
      display: grid; grid-template-columns: 12vh 1fr; align-items: center; gap: 1.6vw;
      height: 7.6vh; padding: 0 1.6vw; border-radius: 2vh; background: var(--bg);
    }
    .trk-row.entering { animation: trk-in .6s cubic-bezier(.2, .8, .2, 1); }
    .trk-no { font-size: 4.6vh; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1; }
    .trk-no small { display: flex; align-items: center; gap: .6vh; margin-top: .6vh; font-size: 1.5vh; font-weight: 700; color: var(--muted); letter-spacing: 0; white-space: nowrap; }
    .trk-no small::before { content: ""; width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--dot, var(--muted)); flex: none; }
    /* 3 steps: the line runs from the centre of the first column to the centre of the last */
    .trk-track { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); }
    .trk-track::before, .trk-fill {
      content: ""; position: absolute; left: calc(100% / 6); top: 1.15vh; height: .55vh; border-radius: 999px;
    }
    .trk-track::before { right: calc(100% / 6); background: var(--line); }
    .trk-fill { background: var(--red); width: calc(100% * 2 / 3 * min(var(--k, 0), 2) / 2); transition: width 1s cubic-bezier(.2, .8, .2, 1); }
    .trk-step {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: .7vh;
      font-size: 1.8vh; font-weight: 700; color: var(--muted); transition: color .4s;
    }
    .trk-step i {
      position: relative; z-index: 1; width: 2.8vh; height: 2.8vh; border-radius: 50%;
      background: #fff; border: .45vh solid var(--line); transition: background .4s, border-color .4s;
    }
    .trk-step.done { color: var(--ink-2); }
    .trk-step.done i { background: var(--red); border-color: var(--red); }
    .trk-step.active { color: var(--red); font-weight: 900; z-index: 3; } /* above neighbouring rows */
    .trk-step.active i { border-color: var(--red); background: #fff; box-shadow: 0 0 0 .5vh var(--red-tint), 0 .4vh 1vh rgba(225, 24, 44, .35); }
    .trk-step.active i::before { content: ""; position: absolute; inset: .45vh; border-radius: 50%; background: var(--red); }
    /* The ping: a ring that keeps expanding out of the current step. Rows are staggered into a gentle wave. */
    .trk-step.active i::after {
      content: ""; position: absolute; inset: -.45vh; border-radius: 50%; border: .35vh solid var(--red);
      /* glow + drop shadow so the ring reads as floating in front of the rows, not painted on them */
      box-shadow: 0 0 1.2vh rgba(225, 24, 44, .55), 0 .6vh 1.4vh rgba(17, 17, 19, .18);
      animation: ping 1.8s cubic-bezier(0, 0, .2, 1) infinite; animation-delay: var(--d, 0s);
    }
    .trk-row.advanced { animation: trk-flash 1.8s ease-out; }
    .trk-row.advanced .trk-step.active i::after { animation: ping-big 1.2s cubic-bezier(0, 0, .2, 1) 2, ping 1.8s 2.4s infinite; }
    .trk-row.leaving { animation: trk-out .7s cubic-bezier(.4, 0, 1, 1) forwards; }
    .trk-pages { display: flex; justify-content: center; gap: 1vh; padding-top: 1vh; min-height: 2.2vh; }
    .trk-pages i { width: 1.2vh; height: 1.2vh; border-radius: 50%; background: var(--line); transition: background .3s, width .3s; }
    .trk-pages i.on { background: var(--red); width: 3vh; border-radius: 999px; }
    .trk-page-no { font-size: 1.8vh; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }

    @keyframes ping { 0% { transform: scale(1); opacity: .95; } 80%, 100% { transform: scale(3); opacity: 0; } }
    @keyframes ping-big { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
    @keyframes trk-in { from { opacity: 0; transform: translateY(3vh) scale(.98); } }
    @keyframes trk-flash { 0% { background: var(--red-tint-2); transform: scale(1.025); } 100% { background: var(--bg); transform: none; } }
    @keyframes trk-out { to { opacity: 0; transform: translateX(-8vw); } }
    @media (prefers-reduced-motion: reduce) {
      .trk-row.entering, .trk-row.advanced, .trk-step.active i::after { animation: none !important; }
    }

    footer { height: 14vh; display: grid; place-items: center; padding: 0 3vw; }
    footer > span { font-size: 3vh; font-weight: 700; }
    footer.normal > span { color: var(--ink-2); }
    footer.backlog > span {
      background: var(--ink); color: #fff; font-size: 3.6vh; font-weight: 800;
      padding: 1.6vh 4vw; border-radius: 999px;
    }
    @keyframes callout { 50% { background: var(--ink); color: #fff; transform: scale(1.05); } }
  </style>
</head>
<body>
  <header class="tv-head">
    <img src="/logo.jpg" alt="Candy Cloud">
    <h1>Candy <em>Cloud</em></h1>
    <span id="conn" class="conn bad">●</span>
    <span class="clock" id="clock"></span>
  </header>
  <main class="tv">
    <section class="ready">
      <h2>お渡しできます <small>Ready</small></h2>
      <div id="ready"></div>
    </section>
    <section class="waiting">
      <h2>準備中 <small>Preparing</small>
        <span class="meta"><span class="pill" id="trk-count"></span><span class="pill wait" id="trk-wait"></span></span></h2>
      <div id="waiting" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="trk-viewport" id="trk-viewport"><div class="trk-list" id="trk-list"></div></div>
        <p class="idle" id="trk-empty"></p>
        <div class="trk-pages" id="trk-pages"></div>
      </div>
    </section>
  </main>
  <footer id="banner" class="normal"></footer>
  <script type="module" src="/display.js"></script>
</body>
</html>
